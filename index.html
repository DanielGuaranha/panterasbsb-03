<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    
    <title>Panteras BSB | Premium Escorts Brasília</title>
    <meta name="description" content="O diretório mais exclusivo de Brasília. Luxo, discrição e segurança." />
    
    <!-- WPO: Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://picsum.photos">
    
    <!-- Fonts: Playfair Display for Headings (Luxury), Lato for Body (Readability) -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
      /* Reset Global para Mobile App Feel */
      html, body {
        overscroll-behavior-y: none; /* Previne efeito elástico */
        background-color: #050505;
        -webkit-tap-highlight-color: transparent; /* Remove highlight azul no toque */
      }

      /* Custom Scrollbar for Luxury Feel */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
      
      .glass-panel {
        background: rgba(30, 30, 30, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.15);
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      }
      
      /* Hide scrollbar for horizontal scrolling areas but keep functionality */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Utilitário para Safe Area no iOS */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .mb-safe {
        margin-bottom: env(safe-area-inset-bottom);
      }
    </style>
</head>
  <body class="bg-midnight text-slate-200 antialiased selection:bg-gold-500 selection:text-midnight overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
